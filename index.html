<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game List for Duo Partner Aulia & Bily</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd6e8;--bg2:#c9b6ff;--bg3:#b6e3ff;--ink:#3b2a5a;--pink:#ff5fa2;--violet:#7c5cff;--card:#ffffffd9;--x:#ff5fa2;--o:#3aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;padding:20px 16px 40px}
.wrap{max-width:520px;margin:0 auto}
h1{font-family:'Pacifico',cursive;font-weight:400;text-align:center;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.35;margin:18px 0 6px;color:#5b2a86;text-shadow:0 2px 0 #fff}
.sub{text-align:center;opacity:.75;margin:0 0 24px}
h2{margin:18px 0 10px;font-size:1.1rem;letter-spacing:.5px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 30px #5b2a8622;backdrop-filter:blur(6px)}
.game{display:flex;align-items:center;gap:14px;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;margin-bottom:12px;transition:.15s}
.game:active{transform:scale(.97)}
.game .ic{font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));border-radius:16px;color:#fff;font-weight:700}
.game b{display:block;font-size:1.15rem}.game small{opacity:.7}
.game.soon{opacity:.55;cursor:default}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{border:0;background:#fff;border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;color:var(--violet);cursor:pointer;box-shadow:0 4px 12px #0001}
.slot{margin-bottom:12px;padding:12px 14px;border-radius:16px;background:#fff}
.slot .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .lbl{font-weight:600}.slot .nm{font-size:1.1rem;font-weight:700}
.tag{font-size:.8rem;background:#efe9ff;border-radius:99px;padding:2px 10px}
.f{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:2px solid #d9ccff;border-radius:12px;outline:none}
input:focus{border-color:var(--violet)}
button.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--violet));cursor:pointer}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.modes{display:flex;gap:8px}
.modes button{flex:1;font:inherit;font-weight:600;padding:12px 0;border-radius:14px;border:2px solid #d9ccff;background:#fff;color:var(--ink);cursor:pointer}
.modes button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.modes button:disabled{opacity:.6}
.big{width:100%;margin-top:14px;padding:14px;font-size:1.1rem}
.hint{text-align:center;font-size:.85rem;opacity:.7;margin:8px 0 0}
.score{display:flex;gap:8px;margin-bottom:12px}
.sc{flex:1;background:#fff;border-radius:16px;padding:10px;text-align:center;border:3px solid transparent}
.sc.turn{border-color:var(--violet);box-shadow:0 0 0 4px #7c5cff22}
.sc .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .s{font-size:1.6rem;font-weight:700}
.X{color:var(--x)}.O{color:var(--o)}
.status{text-align:center;font-weight:600;font-size:1.1rem;margin:6px 0 12px;min-height:1.6em}
.board{display:grid;gap:6px;margin:0 auto;width:min(100%,420px);aspect-ratio:1}
.cell{border:0;border-radius:14px;background:#fff;font:700 clamp(1.4rem,9vw,2.6rem) 'Fredoka';display:grid;place-items:center;cursor:pointer;padding:0;transition:.12s}
.board.big5 .cell{font-size:clamp(1.1rem,7vw,2rem)}
.cell:disabled{cursor:not-allowed}
.board.mine .cell:not(:disabled):active{transform:scale(.92)}
.board:not(.mine){opacity:.85}
.cell.win{background:#fff3a8;animation:pop .5s ease infinite alternate}
@keyframes pop{to{transform:scale(1.06)}}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b2a5a;color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;max-width:90%;text-align:center;z-index:9}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <h1>Hi, Selamat Datang di Game List for Duo Partner Aulia &amp; Bily 💕</h1>
  <p class="sub">Game ini dibuat oleh Bily dengan senang hati untuk my istri, biar enggak bosen 💖</p>
  <h2>🎮 Game List</h2>
  <button class="card game" id="goTtt"><div class="ic">✕○</div><div><b>Tic Tac Toe</b><small>Online 2 HP · mode 3×3, 4×4, 5×5</small></div></button>
  <div class="card game soon"><div class="ic">🔒</div><div><b>Game berikutnya</b><small>Segera hadir…</small></div></div>
</section>

<section id="game" class="hide">
  <div class="top"><button class="back" id="back">← Kembali</button></div>
  <h1 style="font-size:1.8rem;margin-top:4px">Tic Tac Toe</h1>

  <div id="lobby" class="card">
    <div class="slot" id="p1"><div class="row"><span class="lbl X">✕ Player 1</span><span class="tag"></span></div><div class="nm">Belum diisi</div>
      <div class="f"><input maxlength="12" placeholder="Nama player 1"><button class="btn">Konfirmasi</button></div></div>
    <div class="slot" id="p2"><div class="row"><span class="lbl O">○ Player 2</span><span class="tag"></span></div><div class="nm">Belum diisi</div>
      <div class="f"><input maxlength="12" placeholder="Nama player 2"><button class="btn">Konfirmasi</button></div></div>
    <h2>Pilih Mode</h2>
    <div class="modes"><button data-s="3">3 × 3</button><button data-s="4">4 × 4</button><button data-s="5">5 × 5</button></div>
    <p class="hint" id="winhint"></p>
    <button class="btn big" id="play">▶ Play Game</button>
    <p class="hint" id="lobbyHint"></p>
  </div>

  <div id="arena" class="hide">
    <div class="score">
      <div class="sc" id="sc1"><div class="n X"></div><div class="s">0</div></div>
      <div class="sc" id="sc2"><div class="n O"></div><div class="s">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>
    <div class="acts" id="acts"></div>
  </div>
</section>

</div>
<div class="toast hide" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhOrUT2CX3WcO0h4VHSD8vcAE3qRW9hq8",
  authDomain: "gametictac-3afb9.firebaseapp.com",
  projectId: "gametictac-3afb9",
  storageBucket: "gametictac-3afb9.firebasestorage.app",
  messagingSenderId: "804205533800",
  appId: "1:804205533800:web:70cf1973660e95472379dd",
  measurementId: "G-DTGYTJKVYW"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "games", "tictactoe-room");

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = localStorage.getItem('duo-device-id');
if (!me) { me = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('duo-device-id', me); }

const fresh = () => ({ p1: null, p2: null, size: 3, status: 'lobby', board: [], turn: 'X', winner: '', line: [], s1: 0, s2: 0 });
let S = fresh();
const roleOf = d => d.p1 && d.p1.id === me ? 'p1' : d.p2 && d.p2.id === me ? 'p2' : null;
const symOf = d => ({ p1: 'X', p2: 'O' })[roleOf(d)] || null;
const need = n => n === 3 ? 3 : 4;

let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 3000); }

async function upd(fn) {
  try {
    await runTransaction(db, async t => {
      const s = await t.get(ref);
      const d = s.exists() ? s.data() : fresh();
      if (fn(d) === false) return;
      t.set(ref, d);
    });
  } catch (e) { toast('Gagal terhubung: ' + (e.code || e.message)); }
}

function findWin(b, n) {
  const k = need(n);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const v = b[r * n + c]; if (!v) continue;
    for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      const line = [];
      for (let i = 0; i < k; i++) {
        const rr = r + dr * i, cc = c + dc * i;
        if (rr < 0 || rr >= n || cc < 0 || cc >= n || b[rr * n + cc] !== v) break;
        line.push(rr * n + cc);
      }
      if (line.length === k) return line;
    }
  }
  return null;
}

// ----- navigasi -----
$('goTtt').onclick = () => { $('home').classList.add('hide'); $('game').classList.remove('hide'); };
$('back').onclick = () => { $('game').classList.add('hide'); $('home').classList.remove('hide'); };

// ----- lobby -----
for (const k of ['p1', 'p2']) {
  const el = $(k), inp = el.querySelector('input');
  const go = () => {
    const name = inp.value.trim();
    if (!name) return toast('Isi nama dulu ya');
    upd(d => {
      if (d[k] || roleOf(d)) return false;
      d[k] = { name, id: me };
    });
  };
  el.querySelector('button').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  const s = +b.dataset.s;
  upd(d => { if (!roleOf(d) || d.status !== 'lobby') return false; d.size = s; });
});
function startRound(d) {
  d.board = Array(d.size * d.size).fill('');
  d.turn = Math.random() < .5 ? 'X' : 'O'; // acak siapa duluan
  d.status = 'playing'; d.winner = ''; d.line = [];
}
$('play').onclick = () => upd(d => {
  if (!d.p1 || !d.p2 || !roleOf(d) || d.status !== 'lobby') return false;
  d.s1 = 0; d.s2 = 0; startRound(d);
});

// ----- main -----
function move(i) {
  upd(d => {
    if (d.status !== 'playing' || d.board[i] || symOf(d) !== d.turn) return false;
    d.board[i] = d.turn;
    const line = findWin(d.board, d.size);
    if (line) {
      d.status = 'finished'; d.winner = d.turn; d.line = line;
      if (d.turn === 'X') d.s1++; else d.s2++;
    } else if (d.board.every(Boolean)) {
      d.status = 'finished'; d.winner = 'draw';
    } else d.turn = d.turn === 'X' ? 'O' : 'X';
  });
}
function renderBoard() {
  const n = S.size, mySym = symOf(S), myTurn = S.status === 'playing' && mySym === S.turn;
  const bd = $('board');
  bd.className = 'board' + (n === 5 ? ' big5' : '') + (myTurn ? ' mine' : '');
  bd.style.gridTemplateColumns = `repeat(${n},1fr)`;
  bd.innerHTML = '';
  S.board.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'cell' + (S.line.includes(i) ? ' win' : '');
    b.innerHTML = v ? `<span class="${v}">${v === 'X' ? '✕' : '○'}</span>` : '';
    b.disabled = !myTurn || !!v;
    b.onclick = () => move(i);
    bd.appendChild(b);
  });
}
function render() {
  const role = roleOf(S), playing = S.status !== 'lobby';
  $('lobby').classList.toggle('hide', playing);
  $('arena').classList.toggle('hide', !playing);

  if (!playing) {
    for (const k of ['p1', 'p2']) {
      const p = S[k], el = $(k), mine = p && p.id === me;
      el.querySelector('.nm').textContent = p ? p.name : (role ? 'Menunggu pemain lain…' : 'Belum diisi');
      el.querySelector('.tag').textContent = p ? (mine ? 'Kamu 👈' : 'Terkunci 🔒') : '';
      el.querySelector('.f').classList.toggle('hide', !!p || !!role);
    }
    document.querySelectorAll('.modes button').forEach(b => { b.classList.toggle('on', +b.dataset.s === S.size); b.disabled = !role; });
    $('winhint').textContent = `Menang jika ${need(S.size)} simbol berjajar (lurus / diagonal)`;
    $('play').disabled = !(S.p1 && S.p2 && role);
    $('lobbyHint').textContent = !role ? 'Isi namamu di slot yang masih kosong.' : (!S.p1 || !S.p2) ? 'Tunggu partner mengisi nama di HP-nya…' : 'Siap! Salah satu pemain tekan Play.';
    return;
  }

  $('sc1').querySelector('.n').textContent = '✕ ' + S.p1.name; $('sc1').querySelector('.s').textContent = S.s1;
  $('sc2').querySelector('.n').textContent = '○ ' + S.p2.name; $('sc2').querySelector('.s').textContent = S.s2;
  $('sc1').classList.toggle('turn', S.status === 'playing' && S.turn === 'X');
  $('sc2').classList.toggle('turn', S.status === 'playing' && S.turn === 'O');

  const nameOf = s => (s === 'X' ? S.p1 : S.p2).name;
  let st;
  if (S.status === 'playing') {
    st = symOf(S) === S.turn ? '✨ Giliran kamu!' : `Giliran ${esc(nameOf(S.turn))}…` + (role ? '' : ' (kamu penonton)');
  } else st = S.winner === 'draw' ? '🤝 Seri!' : `🏆 ${esc(nameOf(S.winner))} menang!`;
  $('status').innerHTML = st;
  renderBoard();

  const acts = $('acts'); acts.innerHTML = '';
  if (S.status === 'finished' && role) {
    acts.innerHTML = '<button class="btn" id="again">🔁 Main Lagi</button><button class="btn" id="mode">⚙️ Ganti Mode</button>';
    $('again').onclick = () => upd(d => { if (d.status !== 'finished') return false; startRound(d); });
    $('mode').onclick = () => upd(d => { if (d.status !== 'finished') return false; d.status = 'lobby'; d.board = []; d.line = []; d.winner = ''; });
  }
  if (role || (S.p1 && S.p2)) {
    const r = document.createElement('button');
    r.className = 'btn'; r.style.background = '#8a7aa8'; r.textContent = '🗑 Reset Room';
    r.onclick = () => { if (confirm('Reset room? Nama player dan skor akan dihapus untuk kedua HP.')) setDoc(ref, fresh()).catch(e => toast(e.code)); };
    acts.appendChild(r);
  }
}
onSnapshot(ref, snap => { S = snap.exists() ? { ...fresh(), ...snap.data() } : fresh(); render(); },
  e => toast('Firebase error: ' + (e.code || e.message)));
render();
</script>
</body>
</html>
